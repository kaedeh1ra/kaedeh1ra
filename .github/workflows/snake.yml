name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F52FF&color_dots=#ebedf0,#e0d4ff,#b9a0ff,#9a73ff,#7F52FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C711E1&color_dots=#161b22,#3b2470,#5b35b0,#7F52FF,#C711E1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
