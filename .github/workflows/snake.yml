name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the default token only sees public contributions, so refuse to run without a proper one
      - name: Check SNAKE_TOKEN
        env:
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: |
          if [ -z "$SNAKE_TOKEN" ]; then
            echo "::error::Repository secret SNAKE_TOKEN is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          headers=$(curl -sSf -I -H "Authorization: token $SNAKE_TOKEN" https://api.github.com/user | tr -d '\r') || {
            echo "::error::SNAKE_TOKEN is invalid or expired"
            exit 1
          }
          scopes=$(echo "$headers" | grep -i '^x-oauth-scopes:' | cut -d' ' -f2-)
          if ! echo "$scopes" | grep -qE '(^|, )(read:user|user)(,|$)'; then
            echo "::error::SNAKE_TOKEN must be a classic token with the read:user scope (got: '${scopes:-none, fine-grained?}')"
            exit 1
          fi
          echo "token ok, scopes: $scopes"

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F52FF&color_dots=#ebedf0,#e0d4ff,#b9a0ff,#9a73ff,#7F52FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C711E1&color_dots=#161b22,#3b2470,#5b35b0,#7F52FF,#C711E1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
